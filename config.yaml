# ============================================================
# Profil: DINU — cercetare probabilistica / loterii
# NOTA: descrierea profilului se seteaza separat prin: dinu description "..."
# ============================================================
model:
  default: deepseek-v4-flash
  provider: deepseek

terminal:
  cwd: /home/victor/Desktop/Agents/Dinu

# Acces citire la folderele Vasile/Gheorghe (Modul 2 — vezi SOUL.md) se
# realizeaza exclusiv prin permisiuni Linux (grup agent-dinu membru in
# agent-vasile/agent-gheorghe) — NU printr-o cheie de config, vezi INSTALARE.md

compression:
  threshold: 0.88
  target_ratio: 0.20
  protect_last_n: 20

delegation:
  orchestrator_enabled: true
  max_spawn_depth: 1

platform_toolsets:
  telegram: [terminal, web, kanban, cronjob, memory]

timezone: Europe/Lisbon
